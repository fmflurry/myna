[workspace]
resolver = "2"
members = [
    "app/src-tauri",
    "crates/myna-audio",
    "crates/myna-coreaudio-tap",
    "crates/myna-stt",
    "crates/myna-llm",
    "tests/integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Myna contributors"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
cpal = "0.16"
hound = "3.5"
rubato = "5"
ctrlc = "3.4"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
sherpa-onnx = "1.13"
llama-cpp-2 = "0.1.154"
encoding_rs = "0.8"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
too_many_lines = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
