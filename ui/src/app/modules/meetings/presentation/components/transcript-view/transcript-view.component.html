@if (transcript() && transcript()!.segments.length > 0) {
  <ol class="transcript">
    @for (segment of transcript()!.segments; track $index) {
      <li>
        <span class="timestamp">{{ formatTimestamp(segment.startSec) }}</span>
        <app-editable-segment
          class="text"
          [text]="segment.text"
          [editable]="editable()"
          (textChanged)="onSegmentEdited($index, $event)"
        />
      </li>
    }
  </ol>
} @else {
  <p class="empty">No transcript available for this meeting.</p>
}
