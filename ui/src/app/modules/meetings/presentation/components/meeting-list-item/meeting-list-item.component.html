<div
  class="row"
  [class.selected]="selected()"
  [class.disabled]="disabled()"
  [class.drop-before]="indicator() === 'before'"
  [class.drop-after]="indicator() === 'after'"
  [attr.aria-selected]="selected()"
  [attr.aria-disabled]="disabled()"
  [attr.title]="disabledHint()"
  [attr.draggable]="dragEnabled() ? 'true' : null"
  role="option"
  [attr.tabindex]="disabled() ? -1 : 0"
  (click)="activate()"
  (keydown.enter)="activate()"
  (keydown.space)="activate()"
  (keydown.escape)="onEscapeKey($event)"
  (dragstart)="onDragStart($event)"
  (dragend)="onDragEnd()"
  (dragover)="onRowDragOver($event)"
  (dragleave)="onRowDragLeave()"
  (drop)="onRowDrop($event)"
>
  @if (confirmingDelete()) {
    <div class="confirm" [class.warning]="busy()" [attr.role]="busy() ? 'alert' : null">
      <span class="confirm-label">{{ confirmLabel() }}</span>
      <span class="confirm-actions">
        <button type="button" class="confirm-yes" (click)="confirmDelete($event)">Yes</button>
        <button type="button" class="confirm-no" (click)="cancelDelete($event)">No</button>
      </span>
    </div>
  } @else {
    <span class="title">{{ displayTitle() }}</span>
    <span class="meta">{{ meta() }}</span>
    @if (importing()) {
      <span class="status-badge importing" aria-label="Importing">Importing&hellip;</span>
    }
    <button
      type="button"
      class="menu-trigger"
      [attr.aria-label]="menuTriggerLabel()"
      aria-haspopup="menu"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu($event)"
      (keydown.enter)="toggleMenu($event)"
      (keydown.space)="toggleMenu($event)"
    >
      &#8942;
    </button>
    <button type="button" class="delete" aria-label="Delete meeting" (click)="requestDelete($event)">
      &times;
    </button>
    @if (menuOpen()) {
      <div class="menu" role="menu">
        <button
          type="button"
          class="menu-item menu-item-archive"
          role="menuitem"
          (click)="selectArchive($event)"
          (keydown.enter)="selectArchive($event)"
          (keydown.space)="selectArchive($event)"
        >
          {{ archiveLabel() }}
        </button>
        @for (option of folderMenuOptions(); track option.id) {
          <button
            type="button"
            class="menu-item menu-item-folder"
            role="menuitem"
            (click)="selectFolder(option.id, $event)"
            (keydown.enter)="selectFolder(option.id, $event)"
            (keydown.space)="selectFolder(option.id, $event)"
          >
            {{ option.name }}
          </button>
        }
      </div>
    }
  }
</div>
