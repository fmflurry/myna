<div class="meetings-shell">
  <header class="title-bar">
    <button
      type="button"
      class="brand"
      aria-label="Myna — go to meetings"
      title="Home"
      (click)="onGoHome()"
    ></button>

    <div class="title-bar-actions">
      <app-record-control
        [recordingState]="facade.recordingState()"
        [devices]="facade.devices()"
        [selectedDevice]="facade.selectedDevice()"
        [captureSource]="facade.captureSource()"
        [systemAudioStatus]="systemAudioStatus()"
        [audioSources]="facade.audioSources()"
        [selectedAudioSource]="facade.selectedAudioSource()"
        [effectiveSystemSource]="facade.effectiveSystemSource()"
        [level]="facade.level()"
        [elapsedLabel]="elapsedLabel()"
        [disabled]="!modelsReady()"
        [startingRecording]="facade.startingRecording()"
        (deviceChanged)="onDeviceChanged($event)"
        (sourceSelected)="onSourceSelected($event)"
        (audioSourceSelected)="onAudioSourceSelected($event)"
        (permissionRequested)="onPermissionRequested()"
        (recordClicked)="onRecord()"
        (stopClicked)="onStop()"
        (cancelClicked)="onCancel()"
      />
      <button type="button" class="about-trigger" aria-label="About Myna" title="About" (click)="toggleAbout()">
        <span aria-hidden="true">ℹ️</span>
      </button>
    </div>
  </header>

  <div class="workspace">
    <app-meeting-sidebar
      [meetings]="facade.meetings()"
      [selectedId]="facade.selectedMeeting()?.id"
      [selectionDisabled]="facade.busy()"
      [recordingMeetingId]="recordingMeetingId()"
      (meetingSelected)="onMeetingSelected($event)"
      (meetingDeleted)="onMeetingDeleted($event)"
      (meetingArchiveToggled)="onMeetingArchiveToggled($event)"
    />

    <app-meeting-detail-pane
      [meeting]="facade.selectedMeeting()"
      [modelsReady]="modelsReady()"
      [modelsStatus]="facade.modelsStatus()"
      [recordingState]="facade.recordingState()"
      [finalizedSegments]="facade.finalizedSegments()"
      [partialText]="facade.partialText()"
      [templates]="facade.templates()"
      [summaryStream]="facade.summaryStream()"
      [summarizing]="facade.summarizing()"
      [summarizingKey]="facade.summarizingKey()"
      [error]="facade.error()"
      [captureSource]="facade.captureSource()"
      [effectiveSystemSource]="facade.effectiveSystemSource()"
      [summaryLanguages]="facade.summaryLanguages()"
      [selectedSummaryLanguage]="facade.selectedSummaryLanguage()"
      [summaryCache]="facade.summaryCache()"
      [exporting]="exporting()"
      [splitRatio]="facade.splitRatio()"
      [transcriptCollapsed]="facade.transcriptCollapsed()"
      [startingRecording]="facade.startingRecording()"
      (renameRequested)="onMeetingRenamed($event)"
      (segmentEdited)="onSegmentEdited($event)"
      (summarizeRequested)="summarize($event)"
      (cancelSummaryRequested)="cancelSummary()"
      (exportRequested)="exportMeeting($event)"
      (retryRequested)="reload()"
      (recheckModelsRequested)="recheckModels()"
      (summaryLanguageSelected)="onSummaryLanguageSelected($event)"
      (summaryLoadRequested)="onSummaryLoadRequested($event)"
      (splitRatioChanged)="onSplitRatioChanged($event)"
      (transcriptCollapsedChanged)="onTranscriptCollapsedChanged($event)"
      (startRecordingRequested)="onRecord()"
    />
  </div>
</div>

@if (showAbout()) {
  <div
    class="modal-backdrop"
    role="button"
    tabindex="0"
    aria-label="Close dialog"
    (click)="onBackdropActivate($event)"
    (keydown)="onBackdropKeydown($event)"
  >
    <div class="modal">
      <app-attribution [version]="facade.appVersion()" (closed)="toggleAbout()" />
    </div>
  </div>
}
