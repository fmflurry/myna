<div class="meetings-shell">
  <header class="title-bar">
    <button
      type="button"
      class="brand"
      aria-label="Myna — go to meetings"
      title="Home"
      (click)="onGoHome()"
    ></button>

    <div class="title-bar-actions">
      <app-record-control
        [recordingState]="facade.recordingState()"
        [devices]="facade.devices()"
        [selectedDevice]="facade.selectedDevice()"
        [captureSource]="facade.captureSource()"
        [systemAudioStatus]="systemAudioStatus()"
        [audioSources]="facade.audioSources()"
        [selectedAudioSource]="facade.selectedAudioSource()"
        [effectiveSystemSource]="facade.effectiveSystemSource()"
        [level]="facade.level()"
        [elapsedLabel]="elapsedLabel()"
        [disabled]="!modelsReady()"
        [startingRecording]="facade.startingRecording()"
        (deviceChanged)="onDeviceChanged($event)"
        (sourceSelected)="onSourceSelected($event)"
        (audioSourceSelected)="onAudioSourceSelected($event)"
        (permissionRequested)="onPermissionRequested()"
        (recordClicked)="onRecord()"
        (stopClicked)="onStop()"
        (cancelClicked)="onCancel()"
      />
      <button type="button" class="about-trigger" aria-label="About Myna" title="About" (click)="toggleAbout()">
        <span aria-hidden="true">ℹ️</span>
      </button>
      <button type="button" class="settings-trigger" aria-label="Myna settings" title="Settings" (click)="settings.toggleSettings()">
        <span aria-hidden="true">⚙️</span>
      </button>
    </div>
  </header>

  <app-update-banner
    [check]="facade.updates.lastCheck()"
    [dismissedVersion]="facade.updates.dismissedVersion()"
    [installState]="facade.updates.installState()"
    [recording]="facade.busy()"
    [restartError]="updateHandlers.restartError()"
    (dismissed)="updateHandlers.onBannerDismissed()"
    (updateRequested)="updateHandlers.onUpdate()"
    (restartRequested)="updateHandlers.onRestart()"
  />

  <div class="workspace">
    <app-meeting-sidebar
      [meetings]="facade.meetings()"
      [folders]="facade.folders()"
      [expandedFolders]="facade.expandedFolders()"
      [selectedId]="facade.selectedMeeting()?.id"
      [selectionDisabled]="facade.busy()"
      [recordingMeetingId]="recordingMeetingId()"
      [importDisabled]="facade.busy() || facade.importing()"
      (meetingSelected)="onMeetingSelected($event)"
      (meetingDeleted)="onMeetingDeleted($event)"
      (meetingMoveRequested)="onMeetingMoveRequested($event)"
      (importRequested)="onImportRequested()"
      (folderCreated)="onFolderCreated($event)"
      (folderRenamed)="onFolderRenamed($event)"
      (folderDeleted)="onFolderDeleted($event)"
      (folderToggled)="onFolderToggled($event)"
      (meetingArchiveToggled)="onMeetingArchiveToggled($event)"
      (meetingFolderChanged)="onMeetingFolderChanged($event)"
    />

    <app-meeting-detail-pane
      [meeting]="facade.selectedMeeting()"
      [modelsReady]="modelsReady()"
      [modelsStatus]="facade.modelsStatus()"
      [modelDownload]="facade.modelDownload()"
      [recordingState]="facade.recordingState()"
      [finalizedSegments]="facade.finalizedSegments()"
      [partialTextMe]="facade.partialTextMe()"
      [partialTextOthers]="facade.partialTextOthers()"
      [templates]="facade.templates()"
      [summaryStream]="facade.summaryStream()"
      [summarizing]="facade.summarizing()"
      [summarizingKey]="facade.summarizingKey()"
      [error]="facade.error()"
      [captureSource]="facade.captureSource()"
      [effectiveSystemSource]="facade.effectiveSystemSource()"
      [summaryLanguages]="facade.summaryLanguages()"
      [selectedSummaryLanguage]="facade.selectedSummaryLanguage()"
      [summaryCache]="facade.summaryCache()"
      [exporting]="exporting()"
      [splitRatio]="facade.splitRatio()"
      [transcriptCollapsed]="facade.transcriptCollapsed()"
      [startingRecording]="facade.startingRecording()"
      [importing]="facade.importing()"
      [importProgress]="facade.importProgress()"
      [hasAudio]="facade.selectedMeeting()?.hasAudio ?? false"
      [hasSystemTrack]="facade.selectedMeeting()?.hasSystemTrack ?? false"
      [diarizing]="diarizing()"
      [transcriptUndoLabel]="transcriptUndoLabel()"
      [speakerUndoLabel]="speakerUndoLabel()"
      (renameRequested)="onMeetingRenamed($event)"
      (segmentEdited)="onSegmentEdited($event)"
      (speakerRenamed)="onSpeakerRenamed($event)"
      (speakerRemoved)="onSpeakerRemoved($event)"
      (segmentSpeakerReassigned)="onSegmentSpeakerReassigned($event)"
      (segmentGroupSpeakerReassigned)="onSegmentGroupSpeakerReassigned($event)"
      (sectionDeleted)="onSectionDeleted($event)"
      (selectionSpeakerAssigned)="onSelectionSpeakerAssigned($event)"
      (undoTranscriptRequested)="onUndoTranscriptRequested()"
      (undoSpeakerRequested)="onUndoSpeakerRequested()"
      (summarizeRequested)="summarize($event)"
      (cancelSummaryRequested)="cancelSummary()"
      (exportRequested)="exportMeeting($event)"
      (retryRequested)="onErrorRetryClicked()"
      (recheckModelsRequested)="recheckModels()"
      (downloadRequested)="startModelDownload()"
      (downloadCancelRequested)="cancelModelDownload()"
      (summaryLanguageSelected)="onSummaryLanguageSelected($event)"
      (summaryLoadRequested)="onSummaryLoadRequested($event)"
      (summaryEdited)="onSummaryEdited($event)"
      (splitRatioChanged)="onSplitRatioChanged($event)"
      (transcriptCollapsedChanged)="onTranscriptCollapsedChanged($event)"
      (startRecordingRequested)="onRecord()"
      (importRequested)="onImportRequested()"
      (retranscribeRequested)="onRetranscribeRequested()"
      (replaceAudioRequested)="onReplaceAudioRequested()"
      (cancelImportRequested)="onCancelImportRequested()"
      (diarizeRequested)="onDiarizeRequested()"
    />
  </div>
</div>

@if (showAbout()) {
  <div
    class="modal-backdrop"
    role="button"
    tabindex="0"
    aria-label="Close dialog"
    (click)="onBackdropActivate($event)"
    (keydown)="onBackdropKeydown($event)"
  >
    <div class="modal">
      <app-attribution
        [version]="facade.appVersion()"
        [updateConsent]="facade.updates.consent()"
        [lastCheck]="facade.updates.lastCheck()"
        [checking]="facade.updates.checking()"
        [recording]="facade.busy()"
        (closed)="toggleAbout()"
        (updateConsentChanged)="updateHandlers.onConsentChanged($event)"
        (checkNowRequested)="updateHandlers.onCheckNow()"
      />
    </div>
  </div>
}

@if (settings.showSettings()) {
  <div
    class="modal-backdrop settings-backdrop"
    role="button"
    tabindex="0"
    aria-label="Close settings"
    (click)="settings.onBackdropActivate($event)"
    (keydown)="settings.onBackdropKeydown($event)"
  >
    <div class="modal">
      <app-settings
        [updateConsent]="facade.updates.consent()"
        [lastCheck]="facade.updates.lastCheck()"
        [checking]="facade.updates.checking()"
        [recording]="facade.busy()"
        [summaryLanguages]="facade.summaryLanguages()"
        [selectedSummaryLanguage]="facade.selectedSummaryLanguage()"
        (closed)="settings.toggleSettings()"
        (updateConsentChanged)="updateHandlers.onConsentChanged($event)"
        (checkNowRequested)="updateHandlers.onCheckNow()"
        (summaryLanguageSelected)="onSummaryLanguageSelected($event)"
      />
    </div>
  </div>
}

@if (updateHandlers.visible()) {
  <app-update-consent-dialog
    (granted)="updateHandlers.onGranted()"
    (declined)="updateHandlers.onDeclined()"
    (postponed)="updateHandlers.onPostponed()"
  />
}
