name: Release

# Builds, signs (when secrets are configured), verifies, and publishes the
# macOS .dmg + Windows NSIS/MSI installers whenever a `v*` tag is pushed.
# Delegates the actual per-OS build/sign/verify work to
# scripts/release-macos.sh and scripts/release-windows.ps1 — see
# docs/releasing-macos.md for what the macOS script does and how to
# provision the signing secrets referenced below. The shared updater
# manifest (latest.json, one static URL per ADR 0010) is emitted in the
# trailing updater-manifest job from both builds' artifacts.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      # A broken Windows build must not cancel the macOS release (or vice
      # versa); the updater-manifest job below still needs both to succeed.
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    # macos-14 is Apple Silicon (arm64) — required for the macOS 14.4+ Core
    # Audio process-tap APIs.
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Install root dependencies (Tauri CLI)
        run: npm ci

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Warn if no signing certificate is configured
        if: runner.os == 'macOS' && secrets.APPLE_CERTIFICATE == ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          echo "::warning::APPLE_CERTIFICATE secret is not set — this build will ship AD-HOC SIGNED (unsigned)."
          echo "::warning::Ad-hoc builds get a new Designated Requirement on every rebuild, so any microphone"
          echo "::warning::TCC grant a user gives this release will silently break on the next release."
          echo "::warning::See docs/releasing-macos.md for one-time certificate provisioning."

      # Imports the Developer ID certificate into a throwaway keychain so
      # `security find-identity -v -p codesigning` (used by
      # scripts/release-macos.sh to auto-detect the signing identity) can
      # find it. Skipped entirely when no certificate secret is configured —
      # release-macos.sh then falls back to ad-hoc signing on its own and
      # still exits 0. macOS-only: Windows Authenticode needs no keychain.
      - name: Import signing certificate
        if: runner.os == 'macOS' && secrets.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Intentionally unquoted: `security list-keychain -s` requires each existing
          # keychain path as its own argument, so word-splitting here is required to
          # preserve the user's existing search list alongside the new keychain.
          # shellcheck disable=SC2046
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          rm -f "$CERT_PATH"

      # Optional signing/notarization secrets, forwarded as env vars exactly
      # as scripts/release-macos.sh expects (see docs/releasing-macos.md).
      # APPLE_* are optional: when unset, the script signs ad-hoc and skips
      # notarization, and still completes successfully. TAURI_SIGNING_* are
      # required (bundle.createUpdaterArtifacts is true) — the script fails
      # loudly if they're missing rather than shipping an unsigned updater
      # artifact.
      - name: Build, sign, and verify macOS release bundle
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/release-macos.sh

      # Windows counterpart: Authenticode (signtool) instead of codesign, no
      # notarization step. APPLE_* secrets are deliberately NOT forwarded —
      # release-windows.ps1 never reads them. TAURI_SIGNING_* are forwarded
      # exactly as on macOS: the updater artifact must be signed on every
      # platform. LLAMA_STATIC_CRT=1 forces llama-cpp to /MT (static CRT) to
      # match the sherpa-onnx Windows prebuilts; without it the link fails
      # with LNK2038/LNK1169. CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded is
      # the same knob in CMake-native form (forwarded as -D by the crate's
      # build.rs); both agree on MT. macOS is unaffected (no MSVC CRT there).
      - name: Build, sign, and verify Windows release bundle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PATH: ${{ secrets.WINDOWS_CERT_PATH }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LLAMA_STATIC_CRT: '1'
          CMAKE_MSVC_RUNTIME_LIBRARY: 'MultiThreaded'
        run: ./scripts/release-windows.ps1

      # Stashes the signed updater artifacts for the updater-manifest job,
      # which merges both platforms into a single latest.json. The macOS
      # tarball + sig and the Windows NSIS installer + sig keep distinct
      # artifact names so neither leg overwrites the other.
      - name: Stash macOS updater artifact for the manifest job
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-updater
          path: |
            target/release/bundle/macos/Myna.app.tar.gz
            target/release/bundle/macos/Myna.app.tar.gz.sig

      - name: Stash Windows updater artifact for the manifest job
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-updater
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig

      - name: Upload macOS dmg and updater artifacts to GitHub Release
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/Myna.app.tar.gz
            target/release/bundle/macos/Myna.app.tar.gz.sig
          generate_release_notes: true

      - name: Upload Windows installers and updater artifacts to GitHub Release
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.msi.sig

  # Emits target/release-equivalent latest.json from the version in
  # app/src-tauri/tauri.conf.json and the signatures both build legs just
  # produced/verified. Runs on macos-14 because make-latest-json.sh
  # determines the macOS platform key empirically with `lipo`, which only
  # exists on macOS. GITHUB_REF_NAME is set by the runner for the v* tag
  # push that triggered this workflow.
  updater-manifest:
    needs: build
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download macOS updater artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-updater
          path: artifacts/macos

      - name: Download Windows updater artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-updater
          path: artifacts/windows

      - name: Generate combined latest.json for the updater
        run: |
          set -euo pipefail
          NSIS_EXE=(artifacts/windows/*-setup.exe)
          ./scripts/make-latest-json.sh \
            --app-tar-gz artifacts/macos/Myna.app.tar.gz \
            --windows-nsis "$NSIS_EXE" \
            --out artifacts/latest.json

      - name: Upload updater manifest to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/latest.json
