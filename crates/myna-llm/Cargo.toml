[package]
name = "myna-llm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "myna-llm"
path = "src/main.rs"

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# llama-cpp-2 stays on its default CPU-only build (no CUDA/Vulkan
# features): the 2-shard Q4_K_M 32K-context path needs no GPU setup on
# Windows either.
llama-cpp-2 = { workspace = true }
encoding_rs = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
ctrlc = { workspace = true }

[dev-dependencies]
sysinfo = "0.39.6"
tempfile = { workspace = true }
