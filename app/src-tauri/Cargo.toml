[package]
name = "myna-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "myna_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "myna"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
myna-audio = { path = "../../crates/myna-audio" }
myna-stt = { path = "../../crates/myna-stt" }
myna-llm = { path = "../../crates/myna-llm" }

[dev-dependencies]
tempfile = { workspace = true }
hound = { workspace = true }
base64 = "0.22"
url = "2"
# Test-only: tauri::menu re-exports MenuId but not Accelerator, and
# MenuItem::with_id parses accelerator strings silently (errors are
# dropped). menu.rs tests assert the accelerator parses via muda.
# default-features=false keeps muda's libxdo (Linux global-shortcut)
# backend out of the lockfile — only the accelerator parser is used.
# Never promote to a runtime dependency.
muda = { version = "0.19", default-features = false }
